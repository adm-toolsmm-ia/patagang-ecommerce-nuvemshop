commit_guidelines:
  type: "fix"
  scope: "Story 9.1"
  description: "Adjust main padding-top for non-product pages"
  body: |
    Fix white background band on generic pages (/comunidade/, /blog/, etc).

    Root cause: CSS rule scoping - main.patagang-section-content inherited
    padding-top: 160px from Story 8.2 refactoring.

    Solution: Use :not(.template-product) selector to reduce padding-top
    for generic pages (100px desktop, 90px tablet, 80px mobile) while
    keeping product pages at 0px (banners control spacing).

    Changes:
    - Add :not() selectors for generic page padding overrides
    - Maintain product page padding-top: 0 (unchanged)
    - Add media query adjustments (tablet, mobile)
    - Verify CSS size < 50KB + Nuvemshop constraints

    Testing:
    - Tested 5+ generic pages across 3 breakpoints
    - Product page regression tested (no changes)
    - Lighthouse maintained >= 85 mobile
    - Nuvemshop constraints: 8/8 ✓


investigation_summary:
  root_cause: |
    CSS Specificity Conflict:
    - main.patagang-section-content { background-color: #ffffff; } [layout.tpl:505]
    - Has HIGHER specificity than .pg-pdp-banner-warning
    - Overwrites any banner color changes

  problem_identified:
    - body inherits white from settings.background_color
    - main.patagang-section-content reapplies #ffffff redundantly
    - This redundant rule prevents banner styling

  validation_test: |
    v1.5.131 deployed with yellow banner (#FFFF00)
    Result: Yellow did NOT appear (still white)
    Conclusion: CSS rule is being overridden

solution_identified:
  fix_location: theme-deploy-corrigido/layouts/layout.tpl
  line_range: 505-511
  current_code: |
    main.patagang-section-content {
        background-color: #ffffff;
        width: 100%;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

  action: Remove background-color line (505)
  reason: Main will inherit white from body (already set via settings), removes conflict

  alternative_if_needed: |
    If removing causes issues, instead apply:
    section.patagang-section-top {
        background-color: [desired-color] !important;
    }
    with higher specificity


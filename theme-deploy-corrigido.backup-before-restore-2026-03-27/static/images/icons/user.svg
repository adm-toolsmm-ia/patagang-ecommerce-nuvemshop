<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <!-- Ícone Perfil PATAGANG - Cabeça MAIOR que corpo -->
  <!-- Inspirado no PATAGANG_ÍCONE_03_RGB.png -->
  <g stroke="#000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Cabeça grande (elipse) - proporção maior que corpo -->
    <ellipse cx="12" cy="8" rx="5" ry="5.5"/>
    <!-- Corpo menor e mais curto -->
    <path d="M6 22c0-3.3 2.7-6 6-6s6 2.7 6 6"/>
  </g>
</svg>

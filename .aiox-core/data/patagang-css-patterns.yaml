### 📋 LESSONS LEARNED

#### Lesson 1: CSS-HTML Synchronization

**Discovered:** Story 9.1 (`.pg-pdp-banner-warning` was orphaned)

**What Went Wrong:**
```
Commit b707e3a (Story 8.2):
- Created .pg-pdp-banner-warning in CSS ✅
- Was supposed to update HTML to use it
- HTML was NEVER updated ❌
- Class sat orphaned for weeks
```

**Impact:**
- Later, Story 9.1 tried to use this orphaned class
- Spent hours wondering why CSS didn't work
- Root cause: CSS and HTML out of sync

**Rule for Future:**
```
BEFORE deploying:
  1. Add CSS class definition
  2. Add class to HTML element
  3. TEST together

NEVER:
  - Define CSS without using it in HTML
  - Use HTML class that doesn't have CSS
  - Deploy without verifying both exist together
```

---

#### Lesson 2: Cascade Fragility

**Discovered:** Story 9.1 (Banner color wouldn't change)

**What Went Wrong:**
```
Timeline:
1. Removed background-color from main.patagang-section-content ✅
2. Expected banner to show new color ❌
3. Banner still showed old color
4. Why?
   - 188 !important rules in layout.tpl
   - Parent background being forced
   - Multiple media queries
   - Async CSS loading late
   - Result: Unpredictable cascade
```

**Impact:**
- Simple change required 5 deploy attempts
- Developer friction
- Uncertainty about what's working

**Rule for Future:**
```
BEFORE changing CSS:
  1. Understand the cascade (which files run in order?)
  2. Check for !important blocking you
  3. Check for media queries overriding
  4. Verify HTML element exists
  5. Test on 3+ breakpoints

NEVER:
  - Just change CSS and hope
  - Use !important to override !important
  - Ignore media queries
```

---

#### Lesson 3: Code Debt Compounds

**Discovered:** Story 9.1 (Deep investigation revealed 10+ issues)

**Timeline:**
```
Early: One issue (broken cascade)
↓
Someone applies band-aid (188 !important)
↓
Later: New developers avoid CSS (too risky)
↓
Later: Code stays broken (no one fixes root cause)
↓
Later: More features = more !important
↓
Today (Story 9.1): Unmaintainable mess
```

**Impact:**
- 188 !important instead of fixing cascade
- Monolithic CSS instead of modularizing
- Dead code instead of cleaning up
- Performance degradation (224 KB vs 50 KB)

**Lesson:** Fix root causes early. Band-aids compound into debt.

**Action:** Epic 9.2 CSS Refactor (repay the debt)


## PATTERN RECOMMENDATIONS FOR EPIC 9

### For Stories 9.1-9.6

**✅ DO:**
1. Use semantic class naming (`.section-advertising` not `.box-1`)
2. Follow BEM for components (`.block__element`)
3. Mobile-first responsive design
4. Reference settings for colors
5. Test on 3+ breakpoints
6. Verify HTML uses CSS classes before deploying
7. Document workarounds (for Epic 9.2)

**❌ DON'T:**
1. Use !important (unless truly last resort, with comment)
2. Create CSS without HTML (or vice versa)
3. Modify layout.tpl (unless critical, with explanation)
4. Commit commented code without context
5. Assume cascade works (test everything)

---

## PATTERNS FOR EPIC 9.2 REFACTOR

### During CSS Refactoring

**New Patterns to Establish:**

1. **No !important in base CSS**
   - Only in utilities.css (helpers like `.is-hidden`)

2. **3-file architecture:**
   - `style-layout.css` (< 20 KB) — Semantic HTML structure
   - `style-components.css` (< 30 KB) — Reusable components
   - `style-utilities.css` (async) — Helper classes

3. **Full BEM naming**
   - `.block` (component)
   - `.block__element` (sub-part)
   - `.block--modifier` (variant)

4. **Cascade order documented**
   - Each file has clear responsibility
   - No cross-file surprises

5. **Component registry**
   - Each class documented: purpose, where used, responsive notes


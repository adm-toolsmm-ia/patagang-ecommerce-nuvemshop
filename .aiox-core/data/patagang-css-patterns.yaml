## PATTERN REGISTRY

### ✅ GOOD PATTERNS (Maintain These)

#### Pattern 1: Semantic Class Naming

**Type:** Naming Convention
**Discovery:** Story 9.1
**Example:**
```
✅ .section-advertising (clear, descriptive)
✅ .pg-pdp-container (prefixed, scoped)
✅ .pg-identity-banner (purpose is obvious)

❌ .box-1 (generic, useless)
❌ .style-blue (tied to implementation, not purpose)
```

**When to Use:** All new CSS classes
**Why:** Code is self-documenting, easier to maintain

---

#### Pattern 2: BEM-like Structure (Partial)

**Type:** Naming Convention
**Discovery:** Story 9.1
**Example:**
```
✅ .section-advertising (Block)
   ├─ .section-advertising__marquee (Element)
   ├─ .section-advertising__track (Element)
   └─ .section-advertising__copy (Element)

Naming: .block__element (two underscores)
```

**When to Use:** Components with sub-parts
**Why:** Clear hierarchy, prevents naming conflicts
**Note:** Not applied consistently throughout codebase (improvement area for Epic 9.2)

---

#### Pattern 3: Mobile-First Responsive Design

**Type:** CSS Architecture
**Discovery:** Story 9.1
**Example:**
```css
/* style-critical.tpl: Mobile defaults first */
.section-advertising {
  padding: 10px 20px;  /* Mobile size */
}

/* Then desktop overrides via media query */
@media (min-width: 992px) {
  .section-advertising {
    padding: 15px 30px;  /* Desktop size */
  }
}
```

**When to Use:** All responsive CSS
**Why:** Progressive enhancement, smaller CSS initially
**Status:** Good pattern, keep this approach in Epic 9.2

---

#### Pattern 4: Settings-Driven Colors (Nuvemshop Integration)

**Type:** Integration Pattern
**Discovery:** Story 9.1
**Example:**
```scss
/* style-colors.scss.tpl */
$main-background: {{ settings.background_color }};  /* From Nuvemshop */
$main-foreground: {{ settings.foreground_color }};

body {
  background-color: $main-background;
  color: $main-foreground;
}
```

**When to Use:** For theme colors that should be customizable
**Why:** Integrates with Nuvemshop admin theme settings
**Status:** Excellent pattern, maintain in all color definitions


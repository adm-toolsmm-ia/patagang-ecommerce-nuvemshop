### ❌ ANTI-PATTERNS (Fix These - Epic 9.2)

#### Anti-Pattern 1: !important Abuse

**Type:** CSS Cascade Anti-pattern
**Discovery:** Story 9.1 (188 occurrences in layout.tpl!)
**Example:**
```css
/* ❌ layout.tpl lines 79-511 */
body { background-color: #ffffff !important; }
section.patagang-section-top { background-color: transparent !important; }
main.patagang-section-content { background-color: #ffffff !important; }
/* ... 184 more !important ... */

/* WHY: Someone tried to fix cascading issue with band-aid */
/* RESULT: Cascade is now broken, CSS changes unpredictable */
```

**Impact:**
- Simple CSS changes fail 5x
- Developer friction: 3-5x slower modifications
- Unmaintainable cascade

**Fix:** Epic 9.2 refactor (remove ALL !important, fix cascade naturally)

**Lesson:** Never use !important to fix cascade problems. Refactor the cascade itself.

---

#### Anti-Pattern 2: Monolithic CSS Files

**Type:** File Organization Anti-pattern
**Discovery:** Story 9.1
**Example:**
```
Current:
- style-critical.tpl: 4,645 lines (549 classes)
- style-async.scss.tpl: 7,132 lines (697 classes)
Total: 11,777 lines in 2 files

Problems:
- Hard to find specific component styles
- Mixing layout, components, utilities
- Difficult to refactor pieces
```

**Impact:**
- Hard to maintain
- Changes affect unexpected elements
- Reuse difficult

**Fix:** Epic 9.2 refactor into:
- `style-layout.css` (< 20 KB)
- `style-components.css` (< 30 KB)
- `style-utilities.css` (async)

---

#### Anti-Pattern 3: Inline <style> in Template (layout.tpl)

**Type:** Separation of Concerns Anti-pattern
**Discovery:** Story 9.1
**Example:**
```
Current:
theme-deploy-corrigido/layouts/layout.tpl contains:
  <style>
    /* 188 !important declarations embedded in HTML */
    body { background-color: #ffffff !important; }
    section.patagang-section-top { background-color: transparent !important; }
    /* ... more ... */
  </style>

Problems:
- CSS mixed with HTML (defeats MVC separation)
- Hard to reason about CSS (where is it? in layout.tpl!)
- Impossible to minify properly
```

**Impact:**
- Code organization is confusing
- Cache busting difficult
- Reusability poor

**Fix:** Move all CSS to separate files, reference via classes in HTML

---

#### Anti-Pattern 4: Orphaned/Dead CSS Classes

**Type:** Code Cleanliness Anti-pattern
**Discovery:** Story 9.1 (2+ found)
**Example:**
```css
/* style-critical.tpl lines 2807-2817 */
.pg-pdp-banner-warning {
  background-color: #FFFF00;
  padding: 0;
}

.pg-pdp-banner-informative {
  background-color: transparent;
  padding: 0;
}

/* PROBLEM: These classes are DEFINED in CSS but NEVER USED in HTML */
/* They were created in Story 8.2, HTML was never updated */
/* Result: Orphaned code, confusion, wasted space */
```

**Impact:**
- Code clutter
- Confusion (is this class used?)
- Wasted space
- Misleads developers

**Fix:**
- Always verify HTML uses new CSS classes BEFORE deploying
- Archive dead code with traceability (Story, date, reason)
- Never just delete (may be referenced somewhere)

**Status:** Fixed in v1.5.133 (both classes removed)

---

#### Anti-Pattern 5: Commented Code Without Context

**Type:** Code Cleanliness Anti-pattern
**Discovery:** Story 9.1
**Example:**
```scss
/* style-colors.scss.tpl lines 1048-1055 */
/* {# COMMENTED OUT #}
.section-advertising {
  background-color: $main-foreground;
  color: $main-background;
}
*/

/* PROBLEM: Why is this commented? */
/* - Was it broken? */
/* - Replaced by something else? */
/* - Temporary debug? */
/* - Dead code? */
/* We don't know! No context. */
```

**Impact:**
- Confusion (should I uncomment this?)
- Waste time investigating
- Risk of uncommented-but-broken code

**Fix:**
- If dead: Delete with comment (Story, date, reason)
- If temporary: Document why commented + intended fix
- If replaced: Note what replaced it

**Lesson:** Never commit "temporary" commented code. Always document context.


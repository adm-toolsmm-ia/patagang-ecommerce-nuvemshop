  stories:
    - "Docs/stories/8.1-design-tokens-unification.story.md"
    - "Docs/stories/8.2-critical-css-reduction.story.md"
    - "Docs/stories/8.3-important-resolution.story.md"
    - "Docs/stories/8.4-template-cleanup.story.md"
    - "Docs/stories/8.5-javascript-optimization.story.md"
  guides:

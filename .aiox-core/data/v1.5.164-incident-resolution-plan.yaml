## INCIDENT DETAILS

problem_summary: |
  v1.5.164 deployment removed 1,940 lines of CSS code when attempting to
  convert UTF-8 characters to US-ASCII. Script was too aggressive and deleted
  entire CSS rules along with accented comments.

detection_method: automatic_rollback
rollback_version: v1.5.163
rollback_successful: true
time_to_rollback_minutes: 3

## ROOT CAUSE

root_cause: |
  Commit 0fa7dee attempted to remove non-ASCII characters using aggressive
  line deletion pattern: sed '/[ã-ÿçÇ—–]/d'
  This deleted ENTIRE LINES instead of just normalizing characters.

technical_details:
  affected_file: theme-deploy-corrigido/static/css/style-critical.tpl
  lines_deleted: 1940
  lines_added: 987
  files_affected:
    - style-critical.tpl
    - style-async.scss.tpl

  commit_hash: 0fa7dee93f425a70d227d32651ab56603c2ab6c7
  commit_message: "fix: remove non-ASCII characters from CSS files [Epic 8.3 HOTFIX]"

  error_addressed: Invalid US-ASCII character "\xC3"
  target_objective: Force US-ASCII compatibility
  method_used: Line deletion (INCORRECT)
  correct_method: Character normalization (á→a, é→e, etc.)

## VERIFIED FACTS

pg_header_icon_button_status: intact
  description: |
    The .pg-header__icon-button selector rule (lines 424-461) is IDENTICAL
    in both v1.5.163 and v1.5.164 backups. The rule was NOT directly affected.

    Header icons breakage was a cascade effect from OTHER deleted rules,
    not from direct modification to this selector.

backup_comparison:
  v1.5.163:
    line_count: 4771
    status: working
    encoding: UTF-8 with accents
    margin_top_value: 130px

  v1.5.164:
    line_count: 4771
    status: broken
    encoding: US-ASCII (partial - due to deletions)
    margin_top_value: 0px

  only_difference: margin-top property change (valid spacing fix)
  note: |
    The margin-top change between backups is a VALID spacing adjustment.
    The CSS deletion from commit 0fa7dee happened BEFORE these backups
    were created, explaining why backups appear identical in that regard.

## IMPACT ASSESSMENT

impacted_areas:
  directly_deleted:
    - ~150 Portuguese comment lines
    - ~600 CSS rules following those comments
    - ~400 CSS property definitions
    - ~200 media query blocks
    - ~590 other rules and configurations

  ripple_effects:
    - Cascading CSS failures
    - Missing media queries
    - Orphaned selectors
    - Broken layout on responsive views

  unaffected_selectors:
    - .pg-header__icon-button
    - .pg-header__icon-button:hover
    - .pg-header__icon-button img
    - .pg-header__logo
    - Bootstrap grid system

## PROPOSED SOLUTION

solution_type: character_normalization
method: perl_script_substitution
principle: |
  Replace only accented/special characters with ASCII equivalents.
  PRESERVE all CSS structure, rules, and comments.

character_mapping:
  portuguese_accents:
    á: a
    à: a
    â: a
    ä: a
    é: e
    è: e
    ê: e
    ë: e
    í: i
    ì: i
    î: i
    ï: i
    ó: o
    ò: o
    ô: o
    ö: o
    ú: u
    ù: u
    û: u
    ü: u
    ã: a
    õ: o
    ç: c
    Á: A
    À: A
    Â: A
    Ä: A
    É: E
    È: E

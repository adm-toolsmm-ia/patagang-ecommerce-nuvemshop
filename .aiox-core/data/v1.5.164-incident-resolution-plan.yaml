## LESSONS LEARNED

lesson_1:
  title: Character Encoding is Critical
  lesson: |
    UTF-8 encoding issues can be addressed by normalizing characters,
    NOT by deleting lines. The distinction is crucial.

lesson_2:
  title: Test Before Deploy
  lesson: |
    v1.5.164 should have been tested before deployment. Simple checks
    would have caught the 1,940 line deletion.

lesson_3:
  title: Rollback Works
  lesson: |
    Automatic rollback to v1.5.163 was successful and prevented
    extended downtime. System responded correctly to incident.

lesson_4:
  title: Script Safety
  lesson: |
    grep/sed patterns are powerful but dangerous for CSS. Always use
    safer approaches (Perl/Python) with explicit character mapping.

## PREVENTION MEASURES

for_future:
  - Implement pre-deploy CSS validation (line count, selector count)
  - Add encoding checks: file -b && grep /encoding/
  - Require diff review for any CSS changes > 10 lines
  - Document character encoding strategy in CLAUDE.md
  - Add CI/CD gate: CSS file size and structure validation


## Pattern 1: Template Inline Styles Override File-Based CSS

### Problem

CSS modifications in `style-critical.tpl` are being ignored. Root cause: `layout.tpl` contains inline `<style>` blocks that:
1. Load AFTER `style-critical.tpl` in the cascade
2. Use `!important` flags systematically
3. Target the same selectors with HIGH specificity (e.g., `body .selector`)

**Example:** Changing `.section-advertising__copy { font-size: 0.7rem }` in `style-critical.tpl` has NO EFFECT because `layout.tpl` already declared:
```css
body .section-advertising__copy {
    font-size: 0.875rem !important;
}
```

### Why This Happens

In Nuvemshop themes, `layout.tpl` loads AFTER `style-critical.tpl`:

```html
<!-- style-critical.tpl loads first (via {% include %}) -->
<style>
  .section-advertising__copy { font-size: 0.7rem; }  <!-- Gets overridden -->
</style>

<!-- Then layout.tpl loads with inline styles -->
<style>
  body .section-advertising__copy { font-size: 0.875rem !important; }  <!-- Wins! -->
</style>
```

### Solution: Edit layout.tpl, NOT style-critical.tpl

When modifying styling for elements controlled by `layout.tpl` inline styles:

1. **Identify the conflict:** Use DevTools → Computed tab → check which rule is active
2. **Trace back:** Is the rule coming from `layout.tpl` inline `<style>`?
3. **Edit layout.tpl:** Don't waste time editing `style-critical.tpl` — modify the inline `<style>` block in `layout.tpl` directly

**Elements affected by layout.tpl inline styles:**
- `.section-advertising` (ad bar) — lines 230-291
- `.pg-header` — lines 293-319
- `section.patagang-section-*` — lines 439-529


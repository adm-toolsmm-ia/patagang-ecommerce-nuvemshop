## Pattern 3: Modal Responsiveness - Viewport vs Container Sizing

### Problem

When modal opens fullscreen (`position: fixed; width: 100%; height: 100%`), the image inside loads at original resolution (e.g., 2400x3000px). Result: image is MUCH larger than viewport, forcing user to zoom out to see entire image.

### Why This Happens

```css
#pg-modal-gallery[aria-hidden="false"] .pg-modal-main-img {
    /* ❌ NO CONSTRAINTS */
    src="...product_image_url('original')"  /* Full resolution */
}
```

Browser renders image at native dimensions (2400x3000) → exceeds viewport (1920x1080) → image doesn't fit.

### Solution: Viewport-Relative Sizing with object-fit

```css
#pg-modal-gallery[aria-hidden="false"] .pg-modal-main-img {
    max-width: 90vw !important;      /* 90% of viewport width */
    max-height: 90vh !important;     /* 90% of viewport height */
    width: auto !important;          /* Maintain aspect ratio */
    height: auto !important;         /* Maintain aspect ratio */
    object-fit: contain !important;  /* Fit image in box without distortion */
}
```

**Why this works:**
- `max-width: 90vw` caps width to 90% of current viewport
- `max-height: 90vh` caps height to 90% of current viewport
- Together, they fit image in a 90% × 90% box
- `object-fit: contain` shrinks image proportionally to fit inside
- `width: auto` + `height: auto` prevent stretching/distortion


## For Next Developer

When debugging CSS that "should work but doesn't":

1. Read this pattern file FIRST
2. Check DevTools Computed tab
3. Identify which FILE the active rule comes from
4. Edit THAT file, not a different one
5. Don't assume style-critical.tpl is where all CSS goes — layout.tpl is equally important

**Common mistake:** "I edited style-critical.tpl but nothing changed" → Actually need to edit layout.tpl


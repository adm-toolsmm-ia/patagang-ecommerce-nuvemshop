## Pattern 2: Multi-Container Height Conflicts in Flex Layouts

### Problem

When setting `height: 100%` on a `.pg-gallery-container`, it assumes the parent has a defined height. But the parent (`.pg-pdp-image-col`) also has `height: 100%`, which refers to its parent (`.section-single-product`), which may be infinitely tall (flex container).

**Result:** Gallery expands to fit ALL images, growing beyond the info card height.

### Why This Happens

Flex container behavior:
```css
.section-single-product {
    display: flex;
    align-items: stretch;  /* Children match each other's height */
}

.pg-pdp-image-col {
    height: 100%;  /* Refers to .section-single-product height */
}

.pg-gallery-container {
    height: 100%;  /* Refers to .pg-pdp-image-col height = infinite if content grows */
}
```

The gallery content (all 2x2 images) causes the column to grow infinitely.

### Solution: Use max-height with Viewport Constraints

```css
@media (min-width: 992px) {
  .pg-pdp-image-col {
    max-height: calc(100vh - 200px);  /* Limit to viewport - header/margins */
    overflow-y: auto;  /* Allow scroll within container */
  }

  .pg-gallery-container {
    max-height: 100%;  /* Cap to parent's max-height */
    overflow-y: auto;
  }
}
```

**Why this works:**
- `max-height: calc(100vh - 200px)` creates a hard ceiling
- `overflow-y: auto` allows scrolling when content exceeds max-height
- Child elements cannot exceed parent's max-height


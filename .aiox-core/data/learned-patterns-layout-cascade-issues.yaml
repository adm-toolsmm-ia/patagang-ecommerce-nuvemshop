## Pattern 4: Interactive Elements in Fullscreen Modals

### Problem

Navigation arrows in modal are z-stacked incorrectly, positioned absolutely without proper layering. Result: arrows either invisible or unclickable due to:
- Lower z-index than modal backdrop
- Position: relative without explicit positioning
- No pointer-events handling

### Solution: Explicit Stacking and Positioning

```css
#pg-modal-gallery[aria-hidden="false"] .pg-modal-nav {
    display: flex !important;
    position: absolute !important;
    z-index: 1010 !important;  /* Above modal container (1100) */
    width: 44px !important;
    height: 44px !important;
    background-color: rgba(0, 0, 0, 0.5) !important;
    border-radius: 50% !important;
    cursor: pointer !important;
    transition: background-color 0.2s ease !important;
}

.pg-modal-nav--prev {
    left: 20px !important;  /* Left side */
}

.pg-modal-nav--next {
    right: 20px !important;  /* Right side */
}
```

**Why this works:**
- `z-index: 1010` ensures arrows are above modal (1100 is backdrop, 1010 is content)
- `position: absolute` with explicit `left` / `right` places arrows reliably
- `flex` centers icon inside button
- `cursor: pointer` signals interactivity
- `transition` provides visual feedback on hover


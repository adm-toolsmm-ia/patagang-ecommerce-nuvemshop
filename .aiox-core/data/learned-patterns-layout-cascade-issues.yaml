## Debugging Checklist

When CSS changes aren't taking effect:

```
□ 1. DevTools Computed Tab
   ☐ Check which rule is ACTIVE (bold)
   ☐ Check which rules are STRIKETHROUGH (overridden)
   ☐ Note the file/line where active rule comes from

□ 2. Identify Rule Source
   ☐ Is it from style-critical.tpl?
   ☐ Is it from layout.tpl inline <style>?
   ☐ Is it from settings.css_code (admin custom CSS)?
   ☐ Is it from style-colors.scss.tpl?

□ 3. Determine Load Order
   ☐ Which file loads LAST?
   ☐ Does winner rule have !important?
   ☐ What's the specificity? (body .class = higher than .class)

□ 4. Choose Edit Location
   ☐ If rule is from layout.tpl → EDIT layout.tpl
   ☐ If rule is from style-critical.tpl → EDIT style-critical.tpl
   ☐ Match specificity of existing rule (e.g., body .selector for layout.tpl)

□ 5. Validate Change
   ☐ Hard refresh browser (Ctrl+Shift+Delete)
   ☐ Check DevTools Computed tab again
   ☐ Verify rule is now ACTIVE (bold) and no longer STRIKETHROUGH
```


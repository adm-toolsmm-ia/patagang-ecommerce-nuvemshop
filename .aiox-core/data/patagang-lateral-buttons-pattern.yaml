## COMPLIANCE & CONSTRAINTS

### ✅ Sempre Respeitado

- **Nuvemshop Terms:** Sem checkout/footer/form mods
- **CSS Cascata:** !important estratégico apenas
- **Acessibilidade:** WCAG 2.1 nível AA (focus states, aria labels)
- **Responsiveness:** Mobile-first, 3 breakpoints minimum
- **Performance:** CSS inline (sem HTTP requests adicionais)

### ⚠️ Risco Mitigado

- **Z-index conflicts:** Documentar hierarchy clara
- **Hover overflow:** Calcular padding para não ultrapassar viewport
- **Mobile cramping:** Reduzir padding em pequenas telas
- **Keyboard navigation:** Sempre testar Tab + focus ring


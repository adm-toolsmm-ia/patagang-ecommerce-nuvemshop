## AGENT COORDINATION PATTERN

Como os agentes AIOX devem trabalhar juntos neste tipo de correção:

### Phase 1: Investigação (@architect)

**Ativação:** Quando há problema de posicionamento/layout

**Responsabilidades:**
1. Revisar HTML structure da solução existente (Help Button, em caso do WhatsApp)
2. Analisar CSS de referência (style-help-sidebar.css.tpl)
3. Validar z-index hierarchy e stacking context
4. Conferir responsiveness com media queries
5. Consultar aprendizados de Epic 8 (layout cascata)
6. Fornecer recomendação de CSS final

**Saída:** Relatório técnico com CSS validado + recomendações

**Tempo:** ~2 horas investigação


## KNOWLEDGE BASE INFOBOX: Aprendizados Consolidados

### Do Epic 8 (CSS Refactoring Lessons)

- ✅ **Batch CSS em pequenas unidades** (10-15 regras max por deploy)
- ✅ **Validar cascata**: sem !important excessivo
- ✅ **Media queries cobertura**: 768px (tablet) + 480px (mobile pequeno)
- ✅ **Transform para centering**: `transform: translateY(-50%)` é padrão robusto
- ❌ **Não remover 50+ regras de uma vez** (pode quebrar interdependências)

### Do Epic 9 (Layout Cascata)

- ✅ **Z-index hierarchy clara**: Documentar stack order (9999, 9998, 9990, etc.)
- ✅ **Espelhamento L-R**: border-radius, box-shadow, padding animação devem ser simétricos
- ✅ **Template guards**: Usar `{% if template == 'product' %}` para limitar escopo
- ✅ **Nuvemshop constraints rigorosas**: Nunca modificar checkout, footer, forms estruturalmente
- ✅ **Acessibilidade obrigatória**: aria-label + focus state em todo botão interativo

### Do Story 9.2 (WhatsApp Left Button)

- ✅ **Posicionamento fixed requer explícito**: Sem posicionamento, elemento cai em fluxo normal (acima footer)
- ✅ **Transform Y-only centering**: `top: 50% + transform: translateY(-50%)` funciona melhor que `margin-top`
- ✅ **Hover padding change**: Gera feedback visual sem overflow (espaço calculado)
- ✅ **Focus state com cor**: Usar cor do serviço (WhatsApp: #25D366 verde)


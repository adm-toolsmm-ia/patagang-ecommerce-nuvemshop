## PATTERN OVERVIEW

Padrão consolidado para implementar botões fixos nas laterais (LEFT/RIGHT) da página, baseado em aprendizados de Epic 8 e Epic 9.

**Key Property:** Posicionamento `fixed` com centering vertical via `transform: translateY(-50%)`

---

## CORE PATTERN

### Base CSS Template

```css
/* 🔵 LATERAL BUTTON TEMPLATE — Aplicável a qualquer botão fixed */

body .btn-lateral-{direction} {
    position: fixed !important;
    {left|right}: 0 !important;                    /* LEFT: left: 0  |  RIGHT: right: 0 */
    top: 50% !important;
    transform: translateY(-50%) !important;
    z-index: {z-index} !important;                  /* Recomendado: 9990 */
    background-color: #F0F0F0 !important;          /* Cor background padrão (ajustar se necessário) */
    border: 1px solid #E0E0E0 !important;
    padding: 12px 8px !important;                  /* Desktop: 12px 8px */
    border-radius: 4px !important;                 /* Apenas lados internos (top-RIGHT/LEFT + bottom-RIGHT/LEFT) */
    box-shadow: {+|-}2px 0 8px rgba(0,0,0,0.1) !important;  /* LEFT: +2px  |  RIGHT: -2px */
    cursor: pointer !important;
    transition: all 0.3s ease !important;
    text-decoration: none !important;
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    justify-content: center !important;
}

body .btn-lateral-{direction}:hover {
    background-color: #E8E8E8 !important;
    border: 1px solid #D0D0D0 !important;
    padding-{left|right}: 12px !important;         /* LEFT: padding-left  |  RIGHT: padding-right */
}

body .btn-lateral-{direction}:focus {
    outline: 2px solid {icon-color} !important;    /* Usar cor representativa do serviço */
    outline-offset: 2px !important;
}

/* RESPONSIVENESS */
@media (max-width: 768px) {
    body .btn-lateral-{direction} {
        {left|right}: 0 !important;
        top: 50% !important;
        transform: translateY(-50%) !important;
        z-index: {z-index} !important;
        padding: 10px 6px !important;              /* Tablet: reduzido 17% */
    }
    body .btn-lateral-{direction} span {
        font-size: 11px !important;                /* Reduzido 8% */
    }
}

@media (max-width: 480px) {
    body .btn-lateral-{direction} {
        {left|right}: 0 !important;
        top: 50% !important;
        transform: translateY(-50%) !important;
        z-index: {z-index} !important;
        padding: 8px 5px !important;               /* Mobile: reduzido 33% */
    }
    body .btn-lateral-{direction} span {
        font-size: 10px !important;                /* Reduzido 17% */
    }
}
```


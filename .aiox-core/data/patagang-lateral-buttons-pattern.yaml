## FUTURE ENHANCEMENTS

### v1.5.155+: Opcional Improvements

1. **CSS-in-JS Migration**
   - Mover CSS inline para `static/css/style-lateral-buttons.css.tpl`
   - Consolidar Help + WhatsApp em arquivo único
   - Benefício: Reuso em futuras implementações

2. **Focus-Visible Support**
   - Adicionar `:focus-visible` para melhor UX (ignora focus-on-click)
   - Especificidade: `:focus-visible { outline... }`

3. **Aria-Current Enhancement**
   - Se botão representar "current service", adicionar `aria-current="service"`
   - Melhor acessibilidade semântica

4. **Animation Variants**
   - Considerar `@media (prefers-reduced-motion)` para transições
   - Respeitar preferências de usuário


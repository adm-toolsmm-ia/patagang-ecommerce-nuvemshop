## CSS ARCHITECTURE CURRENT STATE

### Loading Order (Cascading Timeline)

**PHASE 1: CRITICAL CSS (Blocks render) — ~224 KB total**
1. `style-critical.tpl` (149 KB, 4,645 lines, 549 classes)
   - Layout structure, components, responsive (mobile-first)
   - Contains 15+ media queries
   - Issues: Monolithic, hard to maintain

2. `style-menu-patagang.css.tpl` (8.3 KB)
3. `style-filters-patagang.css.tpl` (15 KB)
4. `style-help-sidebar.css.tpl` (6.6 KB)

5. **layout.tpl `<style>` section (INLINE)**
   - **188 `!important` declarations**
   - Overrides all above CSS
   - Root cause: Fixes body background cascading issue (band-aid)
   - See: Line 79-511 of theme-deploy-corrigido/layouts/layout.tpl

6. `style-colors.scss.tpl` (25 KB, 1,153 lines)
   - Color overrides, typography
   - SCSS variables: $main-background, $main-foreground, etc.
   - **Status:** 30% commented out (dead code)
   - Issues: Many rules commented, unclear why

**PHASE 2: ASYNC CSS (Non-blocking) — 166 KB**
1. `style-async.scss.tpl` (7,132 lines, 697 classes)
   - Non-critical styles
   - Loads AFTER render (good for performance)
   - Issues: Still has potential conflicts with Phase 1


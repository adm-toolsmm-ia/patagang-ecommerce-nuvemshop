## CRITICAL ISSUES & THEIR STATUS

### Issue 1: Broken CSS Cascade (Band-aid Fix)

**Problem:** `layout.tpl` contains 188 `!important` declarations to override broken cascade

**Root Cause:** Someone tried to fix body background cascading to child elements using `!important` instead of refactoring

**Current Workaround:** 188 `!important` (v1.5.130+)

**Permanent Fix:** Epic 9.2 CSS Refactor (remove all `!important`, fix cascade naturally)

**Impact:**
- Any CSS change requires understanding 188 `!important` rules
- Modifications fail unpredictably (tried 5x in Story 9.1)
- Developer friction: simple changes take 3-5x longer

---

### Issue 2: Monolithic CSS Files (No Modularization)

**Problem:** CSS split into only 2 files (critical + async), both huge

**Current:**
- `style-critical.tpl`: 4,645 lines, 549 classes
- `style-async.scss.tpl`: 7,132 lines, 697 classes

**Result:** Hard to find/modify specific components

**Permanent Fix:** Epic 9.2 refactor into:
- `style-layout.css` (< 20 KB)
- `style-components.css` (< 30 KB)
- `style-utilities.css` (async)

---

### Issue 3: Orphaned CSS Classes (Code Clutter)

**Fixed in v1.5.133:**
- ~~`.pg-pdp-banner-warning`~~ (was never used in HTML)
- ~~`.pg-pdp-banner-informative`~~ (was never used in HTML)

**Root Cause:** Created in Story 8.2, HTML never updated

**Learning:** Always verify HTML uses new CSS classes before deploying

---

### Issue 4: Performance Violation (CSS Size)

**Current:** 224 KB blocking render
**Limit:** 50 KB (Nuvemshop recommended)
**Violation:** 4.48x over

**Impact:** Core Web Vitals degraded (LCP slow)

**Fix:** Epic 9.2 optimization


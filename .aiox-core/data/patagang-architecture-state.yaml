## ARCHITECTURE OVERVIEW

### TECH STACK
- **Frontend Framework:** Nuvemshop Theme (Liquid templates)
- **CSS Architecture:** Monolithic (149 KB critical + 166 KB async)
- **Build System:** Node.js FTP deploy script (custom)
- **Hosting:** Nuvemshop FTP (no local staging environment)
- **Performance Constraint:** < 50 KB critical CSS (currently 224 KB, 4.48x violation)

### DEPLOYMENT WORKFLOW
```
Code → Git Commit → FTP Deploy (v1.x.x auto-increment) → Gabriel Validation → GitHub Push
```

**All deployments MUST follow:** `.claude/rules/patagang-ftp-production-standard.md`


## DEPLOYMENT CONSIDERATIONS FOR EPIC 9

### Before Each Story Deployment

**Quality Gate Checklist:**
```
☐ 1. Verify CSS changes don't break Nuvemshop constraints
☐ 2. Check for !important abuse (use as last resort)
☐ 3. Test on 3+ breakpoints (mobile, tablet, desktop)
☐ 4. Search layout.tpl for conflicting !important rules
☐ 5. Reference Docs/architecture/patagang-css-cascade.md
☐ 6. Gabriel validates in production before merge
```

### Expected Cascade Behavior (Until Epic 9.2)

**Current Cascade (Broken):**
```
style-critical.tpl
  → layout.tpl (188 !important OVERRIDES ALL)
  → style-colors.scss.tpl
  → style-async.scss.tpl
```

**Workaround:** If change doesn't appear:
1. Check layout.tpl for !important blocking you
2. Use !important only as last resort
3. Add comment explaining why (for Epic 9.2 refactor)
4. Document in Docs/architecture/patagang-css-cascade.md


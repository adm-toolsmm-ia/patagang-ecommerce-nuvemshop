## NUVEMSHOP CONSTRAINTS (FTP-Based Platform)

### Hard Constraints (Cannot violate)

**From `.claude/rules/nuvemshop-ftp-constraints.md`:**

| Constraint | Severity | Detail |
|-----------|----------|--------|
| Checkout form structure | 🔴 CRITICAL | Do NOT modify form fields, order, submission |
| Footer attribution | 🔴 CRITICAL | Must remain visible (Nuvemshop ToS) |
| Contact form integrity | 🔴 CRITICAL | Do NOT modify structure, fields |
| Registration form fields | 🔴 HIGH | Do NOT modify form fields |
| Newsletter form structure | 🔴 HIGH | Do NOT modify submission |
| CSS file size | 🔴 HIGH | style-critical.tpl < 50 KB (currently 149 KB) |
| JavaScript overrides | 🔴 HIGH | Do NOT override Nuvemshop.*, window.*, etc. |
| Auto-generated files | 🟠 MEDIUM | Do NOT modify sitemap.xml, robots.txt |

### Safe to Modify

✅ Colors, fonts, spacing, shadows, gradients
✅ CSS animations, transitions, responsive breakpoints
✅ Custom CSS classes (non-structure)


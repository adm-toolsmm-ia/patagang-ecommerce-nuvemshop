## DISCOVERED PATTERNS & ANTI-PATTERNS

### ✅ GOOD PATTERNS (Keep These)

1. **Semantic HTML Structure**
   - Use meaningful class names: `.section-advertising`, `.pg-identity-banner`
   - Avoid generic: `.container-1`, `.box-style`

2. **BEM-like Naming** (partial)
   - `.section-advertising__marquee` (block__element)
   - `.section-advertising__copy` (block__element)
   - **Note:** Not consistently applied throughout

3. **Mobile-First Responsive**
   - style-critical.tpl starts with mobile defaults
   - Media queries layer desktop/tablet (correct approach)

4. **Settings-Driven Colors**
   - `$main-background`, `$main-foreground` from Nuvemshop settings
   - Allows theme customization in admin

### ❌ ANTI-PATTERNS (Fix These — Epic 9.2)

1. **!important Abuse**
   - 188 `!important` to fight broken cascade
   - **Fix:** Refactor cascade, remove ALL `!important` (except utilities)

2. **Monolithic Files**
   - 4,645 + 7,132 lines in 2 files
   - **Fix:** Split into semantic modules (layout, components, utilities)

3. **Inline <style> in layout.tpl**
   - 188 `!important` embedded in HTML template
   - **Fix:** Move to separate CSS files, use classes in HTML

4. **Dead Code**
   - 5-10% orphaned classes, 30% commented rules
   - **Fix:** Archive in `.deprecated/` with traceability

5. **Cascading Confusion**
   - 10 CSS files loaded in specific order
   - No documentation of why
   - **Fix:** Document in `patagang-css-cascade.md` (done v1.5.133)


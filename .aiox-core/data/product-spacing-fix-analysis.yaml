issue:
  title: "Espaçamento vazio desnecessário entre header e galeria de produto"
  severity: MEDIUM
  impact_area: "Página de produto (todas as rotas /produto/*)"
  user_reported_by: "Gabriel Cristofolini (CTO)"

analysis:
  root_cause: "Redundant margin-top on .product-informative-banner"
  description: |
    O `.product-informative-banner` tem `margin-top: 130px` que é REDUNDANTE com
    `main.patagang-section-content { padding-top: 160px }`.

    Cascata CSS atual:
    1. main.patagang-section-content: padding-top: 160px (afasta todo conteúdo do header sticky)
    2. .product-informative-banner: margin-top: 130px (EXTRA! Cria gap vazio)

    Resultado: ~130px de espaço vazio entre identity banner e galeria.

  affected_css_rules:
    - file: "theme-deploy-corrigido/static/css/style-critical.tpl"
      line: 2054
      rule: "div.product-informative-banner { margin-top: 130px; }"
      scope: "Página de produto (template == 'product')"
      protected: false

solution_selected: "OPTION_1_SURGICAL"
rationale: |
  - Minimal change (1 line CSS)
  - Removes redundant spacing exactly
  - Zero regression risk (template-scoped)
  - 15 minutes total (impl + validation)
  - Easily reversible if needed

patch_details:
  description: "Remove margin-top: 130px from .product-informative-banner"
  file: "theme-deploy-corrigido/static/css/style-critical.tpl"
  line_number: 2054

  before: |
    div.product-informative-banner {
      background: transparent;
      background-color: transparent;
      padding: 0.5rem 0;
      margin-top: 130px;  /* ❌ REDUNDANTE */
    }

  after: |
    div.product-informative-banner {
      background: transparent;
      background-color: transparent;
      padding: 0.5rem 0;
      margin-top: 0;  /* ✅ Remove gap (main padding-top já afasta) */
    }

  lines_changed: 1
  risk_level: VERY_LOW


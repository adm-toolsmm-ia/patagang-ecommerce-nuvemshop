      8. Story aligns with epic/roadmap
      9. Risk assessment done (if needed)
      10. File list prepared (optional, @dev adds)

      Scoring: >= 7 = GO, < 7 = NO-GO (return with feedback)
    source: "Constitution Article III (Story-Driven)"
    confidence: "high"


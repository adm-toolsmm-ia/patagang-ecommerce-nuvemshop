    name: "@po Story Validation Checklist (10-Point)"
    discovered: "2026-03-20"
    status: "process"
    pattern: |
      @po MUST validate stories before @dev implementation (Phase 2 SDC):

      1. Story title is clear and actionable
      2. Acceptance criteria are testable (SMART)
      3. No invented features (traceability to requirement)
      4. Story scope is appropriate for 1 iteration
      5. Dependencies identified
      6. Definition of Done present

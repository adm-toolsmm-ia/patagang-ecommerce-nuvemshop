## ============================================================================
## DEVELOPMENT PATTERNS (Feedback from @dev)
## ============================================================================
devPatterns:

  ftpThemeEditing:
    name: "FTP Theme File Editing (Twig + SCSS)"
    discovered: "2026-03-20"
    status: "verified"
    pattern: |
      1. Edit `.tpl` or `.scss.tpl` files in theme-deploy-corrigido/
      2. Test locally (visual inspection or static analysis)
      3. Verify FTP constraints via checklist before commit
      4. Reference Nuvemshop Twig conditionals (template variable)
      5. Update story File List with all modified files
    tools:
      - "coderabbit" (for linting)
      - "ftp-deploy-checklist" (for validation)
    gotchas:
      - "CSS load order matters (see agent memories)"
      - "!important in layout.tpl overrides everything"
      - "Nuvemshop auto-generates sitemap/robots.txt (don't modify)"
    source: "observed"
    confidence: "high"

  cssOptimization:
    name: "CSS Size Optimization (< 50 KB requirement)"
    discovered: "2026-03-20"
    status: "pattern"
    pattern: |
      style-critical.tpl MUST stay < 50 KB (architecture constraint)
      - Audit with: wc -c theme-deploy-corrigido/static/css/style-critical.tpl
      - Remove unused rules (Chrome DevTools Coverage tab)
      - Move non-critical to style-async.scss.tpl
      - Compress images referenced in CSS
      - Use variables/mixins to reduce duplication
    tools:
      - "Chrome DevTools Coverage"
      - "ImageOptim or TinyPNG"
    gotchas:
      - "Embedded base64 images bloat CSS"
      - "Multiple @import statements slow render"
    source: "architecture constraint"
    confidence: "critical"

  nuvemshopFormHandling:
    name: "Nuvemshop Form Field Modifications (Strictly Limited)"
    discovered: "2026-03-20"
    status: "critical_constraint"
    pattern: |
      Contact, Registration, Newsletter forms have LOCKED structure:
      - ✅ SAFE: Modify label text, placeholder, styling, colors
      - ✅ SAFE: Add CSS classes for styling
      - ❌ BLOCKED: Remove form fields
      - ❌ BLOCKED: Change form field order
      - ❌ BLOCKED: Change form submission endpoint

      Rationale: Forms integrate with Nuvemshop backend for email/CRM.
      Structural changes break email delivery and customer data flow.
    tools:
      - "nuvemshop-ftp-constraints.md (rule)"
      - "ftp-deploy-checklist.md"
    gotchas:
      - "CSS display:none hides field but doesn't remove it (OK)"
      - "Adding custom fields outside form is OK (custom JS scope)"
    source: "platform constraint (Nuvemshop TOS)"
    confidence: "critical"

  cssSpecificityStrategy:
    name: "CSS Specificity Strategy for !important Removal (Story 8.3)"
    discovered: "2026-03-24"
    status: "verified"
    pattern: |
      Replace !important declarations via CSS specificity increase:
      - Problem: 1,316 !important rules scattered in CSS
      - Solution: Increase selector specificity instead (e.g., `.header .nav a.active`)
      - Method: Audit with grep, calculate specificity (ID*100 + CLASS*10 + ELEMENT*1)
      - Benefit: Maintains cascade, improves maintainability, reduces overrides

      Process:
      1. Audit !important usage: grep -r "!important" theme-deploy-corrigido/
      2. Map dependencies: which rules override which
      3. Increase specificity: add parent selectors or classes
      4. Test: zero visual regressions on all pages (desktop/tablet/mobile)
    tools:
      - "grep, Lighthouse, Chrome DevTools Computed Styles"
    gotchas:
      - "Don't just remove !important without specificity increase (will regress)"
      - "Cascade order matters: later rules win (use child selectors)"
    source: "Story 8.3 execution (Epic 8 refactoring)"
    confidence: "high"

  cartRecoveryPattern:
    name: "Cart Recovery — Preserve cupom GANGDAPATA + ONG (Story 8.4/8.5)"
    discovered: "2026-03-24"
    status: "critical"
    pattern: |
      When recovering cart/checkout after refactoring:
      - MUST preserve: cupom ID 'GANGDAPATA' (vendor special offer)
      - MUST preserve: ONG association (non-profit partner)
      - Risk: Removing template code can lose cart state

      Safe Approach:
      1. Before cleanup: Document current cart.tpl structure
      2. Verify cupom references in template variables
      3. Ensure ONG relation mapping preserved
      4. Test: Add item to cart, apply GANGDAPATA coupon, validate ONG attribution
      5. After deploy: Gabriel validates in production (is cart still works)
    tools:
      - "theme-deploy-corrigido/snipplets/ (cart related)"
      - "FTP logs for validation"
    source: "Story 8.4 (template cleanup) + Story 8.5 (recovery)"
    confidence: "critical"

  ftpRecoverySafe:
    name: "FTP Recovery Seguro via rollback-incremental.js (Epic 8.5)"
    discovered: "2026-03-24"
    status: "verified"
    pattern: |
      When production deploy has issues:
      1. Use: node ftp-deploy/rollback-incremental.js --version vX.X.X-1
      2. This reverts to PREVIOUS working version (not full reset)
      3. Faster than manual file restoration (< 30 seconds)
      4. Maintains backup history for investigation

      Advantages:
      - Quick rollback: Get production stable immediately
      - Version tracking: Know what was broken (git tag system)
      - Root cause analysis: Can investigate failed version after rollback
      - Zero data loss: Backups preserved for recovery steps
    tools:
      - "ftp-deploy/rollback-incremental.js"
      - "ftp-deploy/logs/ (deployment history)"
    gotchas:
      - "Always test on staging first (but Patagang has no staging — production IS staging)"
      - "Document rollback reason in git for future reference"
    source: "Epic 8.5 (production validation strategy)"

  bannerContentStrategy:
    name: "Banner Content Strategy — Hardcoded vs Dynamic (Story 8.3 Phase B)"
    discovered: "2026-03-26"
    status: "verified"
    pattern: |
      DECISION RULE: Use HARDCODED TEXT for banner content when:
      1. Content is STATIC (never changes without deployment)
      2. Nuvemshop Liquid syntax is limited (no 'contains', 'for' loops, complex logic)
      3. Robustness is critical (no parsing errors)
      4. Performance is key (simpler template = faster render)

      FAILED APPROACH (v1.5.156-160):
      - Attempted dynamic text via Liquid variables/loops
      - Nuvemshop doesn't support: 'contains' filter, scoped variables, complex for loops
      - Result: HTTP 500 errors, parsing failures, rollbacks

      SUCCESSFUL APPROACH (v1.5.161):
      - Hardcoded 3 phrases: "Frete grátis acima de R$250", "10% OFF no PIX", "30 dias para trocas"
      - Used flexbox + gap: 0.5em for consistent spacing
      - 3 breakpoints (mobile/tablet/desktop) for responsivity
      - Zero Liquid complexity, zero parsing errors

      FUTURE STRATEGY FOR BANNERS:
      Layer 1 (STATIC): Hardcoded in TPL + CSS (use for marketing banners)
      Layer 2 (SEMI-STATIC): Config YAML in .aiox-core/data/banners-content.yaml (use for seasonal)
      Layer 3 (DYNAMIC): API call via custom JS (future phase, if needed)

      Why this layering:
      - Layer 1 is simplest, most robust, no deploy overhead
      - Layer 2 allows content changes without code commit (config-driven)
      - Layer 3 is for truly dynamic content (promotions, inventory, etc.)
    tools:
      - "header-advertising.tpl (hardcoded banner)"
      - "style-critical.tpl (flexbox + gap CSS)"
      - ".aiox-core/data/banners-content.yaml (future config)"
    gotchas:
      - "Don't use Liquid 'contains', 'for loops', or complex logic in Nuvemshop"
      - "Flexbox gap is reliable alternative to word-spacing/margin hacks"
      - "3 breakpoints (mobile/tablet/desktop) covers responsive requirements"
      - "Test HTTP 200 after deploy (500 errors indicate Liquid parsing failure)"
    confidence: "high"
    source: "Story 8.3 Phase B (v1.5.161 deployment)"
    confidence: "high"


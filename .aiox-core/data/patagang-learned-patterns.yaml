## ============================================================================
## ARCHITECTURE PATTERNS (Feedback from @architect)
## ============================================================================
architectPatterns:

  cssLoadOrder:
    name: "CSS Cascata Load Order (Critical for Specificity)"
    discovered: "2026-03-20"
    status: "foundational"
    pattern: |
      Load order is CRITICAL for CSS specificity:
      1. style-critical.tpl (inline, FIRST PAINT, lowest specificity)
      2. style-colors.scss.tpl (async, theme colors)
      3. style-async.scss.tpl (async, non-critical styles)
      4. layout.tpl <style> block (inline, FINAL OVERRIDE with !important)

      Pattern: Use layout.tpl final override for cross-cutting fixes.
      Example: Help button color change goes in layout.tpl <style> with !important
    rationale: "Nuvemshop auto-injects styles; final override ensures consistency"
    source: "observed in production theme"
    confidence: "critical"

  nuvemshopTwigConditionals:
    name: "Nuvemshop Template Conditionals for Page-Specific Styling"
    discovered: "2026-03-20"
    status: "pattern"
    pattern: |
      Use Twig conditionals to apply styles to specific pages:

      {% if template == 'product' %}
        <style>/* Product page styles */</style>
      {% endif %}

      Available conditionals:
      - {% if template == 'product' %}
      - {% if template == 'category' %}
      - {% if template == 'home' %}
      - {% if template == 'cart' %}
      - {% if template == 'checkout' %} (LOCKED structure)
      - {% if template == 'account.*' %}
      - {% if template == 'search' %}
    rationale: "Avoid global CSS; keep styles scoped to pages that need them"
    source: "Nuvemshop platform documentation"
    confidence: "high"


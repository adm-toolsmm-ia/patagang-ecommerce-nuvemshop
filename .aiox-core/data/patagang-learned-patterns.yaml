## DEPLOYMENT PATTERNS (Feedback from @devops)
## ============================================================================
deploymentPatterns:

  ftpVersioning:
    name: "FTP Auto-Versioning on Deploy"
    discovered: "2026-03-20"
    status: "process"
    pattern: |
      Each FTP deploy is automatically versioned:
      - Format: v{YYYY-MM-DD}-{iteration}
      - Example: v2026-03-20-01, v2026-03-20-02
      - Backup: Previous version backed up to backups/incremental/

      Rollback: Manual FTP restore from backup folder if deployment fails
    tools:
      - ".aiox-core/infrastructure/ftp-deployment/"
    source: "implemented in deploy scripts"
    confidence: "verified"

  preDeploymentGates:
    name: "Pre-Deployment Checklist (Before @devops Push)"
    discovered: "2026-03-20"
    status: "gate_pattern"
    pattern: |
      @devops MUST verify BEFORE pushing:
      1. @dev provided story marked DONE
      2. @qa provided PASS verdict
      3. FTP deployment checklist ✅
      4. No Nuvemshop constraint violations
      5. PR description includes story ID + AC + files
      6. All GitHub checks ✅ (CodeRabbit, lint, tests)
      7. No merge conflicts

      Any gate failure → BLOCK and return to earlier phase
    source: "Constitution Article II (Agent Authority) + Article V (Quality First)"
    confidence: "critical"


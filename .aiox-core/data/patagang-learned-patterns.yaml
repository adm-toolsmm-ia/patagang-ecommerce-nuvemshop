# Patagang Learned Patterns (Active)
# Type: Learned Patterns (L3)
# Scope: reusable patterns for future improvements

version: "2.0.0"
last_updated: "2026-03-27T00:00:00Z"
last_verified_from_code: "2026-03-27T00:00:00Z"
theme_version_reference: "1.5.170"
status: "active"
context_policy: "default-context"

patterns:
  - id: "PATTERN-CSS-CASCADE-ORDER"
    category: "css"
    name: "CSS cascade load order is decisive"
    summary: "A ordem entre style-critical, style-colors, style-async e inline style no layout define o resultado final."
    apply_when:
      - "ajustes visuais nao aplicam como esperado"
      - "mesmo seletor aparece em multiplos arquivos"
    references:
      - "theme-deploy-corrigido/layouts/layout.tpl"
      - "theme-deploy-corrigido/static/css/style-critical.tpl"
      - "theme-deploy-corrigido/static/css/style-async.scss.tpl"

  - id: "PATTERN-LAYOUT-OVERRIDE-PRESSURE"
    category: "css"
    name: "Inline CSS no layout tem alta forca de override"
    summary: "Trechos inline no layout podem sobrepor estilos de arquivos externos e gerar falso negativo em testes locais."
    apply_when:
      - "mudanca em style-critical nao surte efeito"
      - "ha !important competindo entre camadas"
    references:
      - "theme-deploy-corrigido/layouts/layout.tpl"

  - id: "PATTERN-PAGE-SCOPED-STYLING"
    category: "templating"
    name: "Preferir escopo por template para mudancas especificas"
    summary: "Estilos e ajustes devem usar escopo por template para reduzir regressao cruzada."
    apply_when:
      - "ajuste afeta somente produto/categoria/home"
      - "regressao aparece em paginas nao alvo"
    references:
      - "theme-deploy-corrigido/layouts/layout.tpl"
      - "theme-deploy-corrigido/templates/product.tpl"

  - id: "PATTERN-FTP-DEPLOY-SAFETY"
    category: "deployment"
    name: "Deploy FTP com backup e rollback imediato"
    summary: "Fluxo de deploy deve sempre manter backup e rollback pronto para conter regressao em producao."
    apply_when:
      - "qualquer alteracao em tema"
      - "hotfix em janela curta"
    references:
      - "ftp-deploy/deploy.js"
      - "ftp-deploy/rollback-incremental.js"
      - ".aiox-core/development/docs/FTP_DEPLOY_GUIDE.md"

  - id: "PATTERN-NUVEMSHOP-CONSTRAINTS"
    category: "platform"
    name: "Respeitar limites estruturais da plataforma"
    summary: "Checkout e formularios gerenciados pela plataforma exigem cuidado; priorizar ajustes visuais e comportamentais seguros."
    apply_when:
      - "mudancas em checkout, cadastro, contato ou newsletter"
      - "alteracao de JS em fluxo de carrinho/frete"
    references:
      - "Docs/architecture/patagang-store/07-NUVEMSHOP-CONSTRAINTS.md"
      - "theme-deploy-corrigido/static/checkout.scss.tpl"

usage_guidelines:
  - "Esses padroes nao representam backlog; sao guias de execucao."
  - "Aplicar padroes sem travar melhorias futuras."
  - "Validar sempre no codigo atual antes de decidir."

metadata:
  maintained_by: "@architect, @dev, @qa"
  review_trigger:
    - "regressao recorrente"
    - "mudanca relevante de arquitetura do tema"

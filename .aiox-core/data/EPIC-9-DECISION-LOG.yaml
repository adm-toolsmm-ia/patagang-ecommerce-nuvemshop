## DECISION RECORD

### Context

**Problem:** Story 9.1 (banner color) required 5+ deploy attempts. Root cause: CSS cascade broken by 806 `!important` rules and monolithic file structure.

**Urgency:** Gabriel has additional critical stories (9.3 info card mobile). Continuing with patch-based CSS changes would require:
- 5+ deploy attempts per story
- 10+ days per story (vs. 2-3 days needed)
- 6+ weeks total for Stories 9.2-9.6 (vs. 3 weeks desired)
- High team frustration and Gabriel burnout

**Options Evaluated:**

| Option | Description | Viability | ROI |
|--------|-------------|-----------|-----|
| **Opção 1** | Continue with CSS patches (current approach) | YES but painful | -6 weeks, high friction |
| **Opção 2** | Full Epic 9.2 CSS refactor (2+ weeks paused) | YES but slow | 0 velocity for 2 weeks |
| **Opção 3 (CHOSEN)** | Hybrid: 5-day cleanup (Fase A) + Stories (Fase B) | YES and optimal | +10 days net gain |

---

## DECISION

### ✅ APPROVED: Opção 3 (Hybrid) — Fase A Cleanup + Fase B Stories

**Timeline:**
- **Fase A (Days 1-5):** CSS stabilization cleanup
- **Fase B (Days 6-21):** Stories 9.2-9.6 execution (3 weeks)
- **Total:** 3-4 weeks (vs. 6+ weeks with Opção 1)

**Approval Authority:**
- ✅ @architect (Aria) — Recommended
- ✅ @dev (Dex) — Recommended (85% confidence)
- ✅ @pm (Morgan) — Recommended (ROI justified)
- ✅ @qa (Quinn) — Recommended (risk mitigated)
- ✅ @sm (River) — Recommended (planning viable)

**Unanimous consensus: 5/5 agents agree**

---

## RATIONALE

### Technical

- CSS architecture is not "broken", it is "inherited" (806 `!important` for legacy compatibility)
- Cascade impairment is solvable in 5 days by removing:
  - 200+ orphaned CSS classes (not used in HTML)
  - 100+ redundant `!important` rules (same rule defined 2+ times)
  - Consolidation to ~400-500 essential `!important` rules (50% reduction)
- After cleanup: CSS becomes predictable, Stories execute 3x faster

### Strategic

- **Fase A investment (5 days):** Technical debt resolution
- **Fase B payoff (15 days):** 2-3 stories/week (vs. 0.5 stories/week with patches)
- **Net ROI:** -5 days today, +15 days saved tomorrow = **+10 days net gain**
- **Visibility:** Stories are visible to stakeholders, cleanup is invisible (necessary foundation)

### Organizational

- **Team morale:** Patches create frustration (5+ failed attempts/story). Cleanup → success (1-2 attempts/story)
- **Velocity:** Gabriel's productivity increases from 0.5/day (with patches) to 2/day (after cleanup)
- **Sustainability:** Post-cleanup establishes "zero new `!important`" norm for future development

---

## FASE A PLAN (5 Days)

### Day 1-2: CSS Dependency Mapping
- @dev: Script to identify all 806 `!important` rules in layout.tpl
- @dev: Map which HTML elements depend on each rule
- @dev: Classify as Critical (keep) vs. Redundant (remove) vs. Orphaned (delete)
- Gabriel: Review mapping, approve removals
- Deliverable: Dependency graph document

### Day 2-4: Remove Orphans & Consolidate
- @dev: Remove 200+ orphaned CSS classes (parallel execution)
- @dev: Consolidate 100+ redundant `!important` rules
- @dev: Daily deployment (v1.5.134, v1.5.135, v1.5.136)
- Gabriel: Daily validation (< 4h turnaround)
  - Homepage render OK?
  - Product page OK?
  - Blog OK?
  - Mobile OK?
- Safety: Rollback available for each day

### Day 5: Final Validation & Documentation
- @dev + @qa: Lighthouse test (target: 90+ mobile)
- @qa: Visual regression test (compare to v1.5.133)
- @dev: Performance metrics (CSS size, render time)
- @dev: Documentation (what changed, why, next steps)
- Gabriel: Final sign-off
- Deliverable: Clean CSS, documented, QA verified


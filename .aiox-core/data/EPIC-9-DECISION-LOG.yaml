## FALLBACK & ABORT CRITERIA

**If Fase A shows problems:**
- Day 1-2: Risk assessment, decide to continue or pause
- Day 3: Cumulative regression risk > 20% → PAUSE, reassess
- Day 4-5: If any production issue → ROLLBACK, repeat next day

**Abort condition:** If cleanup cannot complete in 5 days cleanly → revert to Opção 1 (patches) with clear documentation of what blocked


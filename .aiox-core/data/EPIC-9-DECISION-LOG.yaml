## RISKS & MITIGATIONS

| Risk | Probability | Impact | Mitigation |
|------|-------------|--------|-----------|
| Cleanup removes critical rule | 10% | HIGH | Dependency analysis + Gabriel daily validation |
| Regression in production | 15% | MEDIUM | QA gate + Lighthouse validation + rollback |
| Takes > 5 days | 20% | MEDIUM | Scope control + early termination if overruns |

# ============================================================================
# IMPACT ANALYSIS — What breaks when each component changes?
# ============================================================================

impact_matrix:
  store_js:
    direct_impact: 15  # 15 components/pages depend on it
    risk_level: "CRITICAL"
    breaking_changes:
      - "Remove cart operations → cart page broken"
      - "Remove form validation → contact form broken"
      - "Change modal API → modals don't work"
    testing_required: "Full regression test (cart, product, forms, all pages)"

  style_critical:
    direct_impact: "ALL pages + snipplets"
    risk_level: "CRITICAL"
    breaking_changes:
      - "Remove grid layout → page layout broken"
      - "Remove form styles → forms unstyled"
      - "Remove header styles → header broken"
    testing_required: "Visual regression test on all pages"

  external_js:
    direct_impact: 8
    risk_level: "HIGH"
    breaking_changes:
      - "Remove Swiper → product image slider broken"
      - "Remove Olark → chat unavailable"
    testing_required: "Test Swiper, GA tracking, Facebook integration"

  navigation_mega_menu:
    direct_impact: "ALL pages"
    risk_level: "HIGH"
    breaking_changes:
      - "Remove mega menu → category navigation broken"
    testing_required: "Desktop & mobile navigation test"

  cart_panel:
    direct_impact: "ALL pages"
    risk_level: "HIGH"
    breaking_changes:
      - "Remove cart drawer → mini-cart unavailable on all pages"
    testing_required: "Add to cart flow, cart updates via AJAX"

  product_form:
    direct_impact: "product page + related"
    risk_level: "CRITICAL"
    breaking_changes:
      - "Remove variant selector → variants not selectable"
      - "Remove quantity input → can't change quantity"
      - "Break Nuvemshop integration → checkout fails"
    testing_required: "Product variant selection, add to cart, checkout"


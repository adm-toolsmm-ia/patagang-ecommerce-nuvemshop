# ============================================================================
# NUVEMSHOP CONSTRAINTS — Critical restrictions
# ============================================================================
constraints:
  nuvemshop_critical:
    - id: "CONSTRAINT #1"
      name: "Checkout Form Structure"
      severity: "CRITICAL"
      restriction: "Do NOT modify checkout page structure or form fields"
      pages_affected: ["checkout", "cart"]
      allowed_changes: ["CSS styling only", "Colors", "Typography"]
      forbidden_changes: ["Field removal", "Field reordering", "Form endpoint modification"]

    - id: "CONSTRAINT #2"
      name: "Footer Attribution"
      severity: "CRITICAL"
      restriction: "Footer MUST contain visible Nuvemshop store attribution"
      pages_affected: ["all"]
      allowed_changes: ["Styling", "Positioning", "Additional content before/after"]
      forbidden_changes: ["Removal", "Hidden (display:none, opacity:0, etc)", "Moved off-screen"]
      file_location: "snipplets/footer.tpl"

    - id: "CONSTRAINT #3"
      name: "Contact Form Integrity"
      severity: "HIGH"
      restriction: "Do NOT modify contact form structure, fields, or submission"
      pages_affected: ["contact", "page"]
      file_location: "snipplets/contact-links.tpl"
      allowed_changes: ["Input styling", "Placeholder text"]
      forbidden_changes: ["Field removal", "Submission endpoint change", "Field reordering"]

    - id: "CONSTRAINT #4"
      name: "CSS Performance Budget"
      severity: "HIGH"
      restriction: "Critical CSS must be < 50KB (currently 163KB — EXCEEDS)"
      pages_affected: ["all"]
      current_status: "⚠️ OVERSIZE — Story 8.2 goal: reduce to 50KB"
      action_plan: "Consolidate styles, extract unused CSS, split critical/async"

    - id: "CONSTRAINT #5"
      name: "Registration Form"
      severity: "HIGH"
      restriction: "Do NOT modify registration form fields or validation"
      pages_affected: ["account_register"]
      file_location: "templates/account/register.tpl"
      allowed_changes: ["CSS styling", "Label text styling"]
      forbidden_changes: ["Field addition", "Validation logic change", "Form endpoint"]

    - id: "CONSTRAINT #6"
      name: "Newsletter Form"
      severity: "HIGH"
      restriction: "Do NOT modify newsletter form submission"
      pages_affected: ["home", "page"]
      file_locations: ["snipplets/newsletter.tpl", "snipplets/modal-newsletter.tpl"]
      allowed_changes: ["Button styling", "Input styling"]
      forbidden_changes: ["Form action change", "Field removal", "Endpoint modification"]

    - id: "CONSTRAINT #7"
      name: "JavaScript Safety"
      severity: "MEDIUM"
      restriction: "Custom JS must NOT override Nuvemshop core functions"
      allowed_changes: ["Scoped IIFE functions", "Event listeners", "Helper functions"]
      forbidden_changes: ["window.Nuvemshop.* overrides", "jQuery $ override", "Global variable pollution"]

    - id: "CONSTRAINT #8"
      name: "Auto-Generated Files"
      severity: "MEDIUM"
      restriction: "Do NOT modify Nuvemshop auto-generated files"
      files: ["sitemap.xml", "rss.xml", "robots.txt"]
      note: "These are regenerated daily by Nuvemshop"


---
# Patagang Store Catalog — Complete Architecture Index
# Type: Configuration (L3 — Project Configuration, mutable)
# Purpose: Machine-readable index of store structure for quick lookup and context enrichment
# Consumed by: Agents (@dev, @qa, @architect), AI for context engineering
# Updated: Continuously as structure evolves
# Format: YAML — 1.2 (keys: lowercase, underscores for multi-word)

version: "1.0.0"
lastUpdated: "2026-03-24T21:15:00Z"
project: "Patagang Ecommerce Theme (Nuvemshop FTP)"
platform: "Nuvemshop Liquid Templating"
theme_base: "theme-deploy-corrigido/"

# ============================================================================
# PAGES — Complete page inventory with structure
# ============================================================================
pages:
  home:
    id: "home"
    name: "Homepage"
    template_file: "templates/home.tpl"
    type: "landing"
    description: "Main homepage with hero section, product grids, and brand mission"
    route: "/"
    sections:
      - name: "Hero V2"
        component: "hero-v2"
        type: "banner"
        css: ["style-critical.tpl", "style-home-v2.css"]
        js: ["smooth-scroll.js"]
      - name: "Vista Products Grid"
        component: "product-grid"
        type: "product-showcase"
        css: ["style-critical.tpl", "style-async.scss.tpl"]
        js: ["store.js.tpl", "product-page-custom.js"]
      - name: "Development Products Section"
        component: "dev-products-grid"
        type: "product-showcase"
        css: ["style-critical.tpl"]
        js: ["store.js.tpl"]
    snipplets:
      - "breadcrumbs.tpl"
      - "product_grid.tpl"
      - "newsletter.tpl"
    performance:
      lcp_target: "home-v2-hero"
      critical_css_required: true
      estimated_load_time: "1.2s"
    nuvemshop_constraints: []

  product_detail:
    id: "product"
    name: "Product Detail Page (PDP)"
    template_file: "templates/product.tpl"
    type: "product"
    description: "Individual product page with images, variants, pricing, reviews"
    route: "/products/:slug"
    sections:
      - name: "Product Identity Banner"
        component: "product-identity-banner"
        file: "snipplets/product/product-identity-banner.tpl"
        css: ["style-critical.tpl"]
      - name: "Product Informative Banner"
        component: "product-informative-banner"
        file: "snipplets/product/product-informative-banner.tpl"
        css: ["style-critical.tpl"]
      - name: "Product Images"
        component: "product-image"
        file: "snipplets/product/product-image.tpl"
        css: ["style-critical.tpl", "style-async.scss.tpl"]
        js: ["external.js.tpl"]
      - name: "Product Form & Variants"
        component: "product-form"
        file: "snipplets/product/product-form.tpl"
        css: ["style-critical.tpl"]
        js: ["store.js.tpl", "external.js.tpl"]
      - name: "Related Products"
        component: "product-related"
        file: "snipplets/product/product-related.tpl"
        css: ["style-async.scss.tpl"]
        js: ["store.js.tpl"]
    snipplets:
      - "product/product-image.tpl"
      - "product/product-form.tpl"
      - "product/product-related.tpl"
      - "product/product-payment-details.tpl"
      - "product/product-custom-fields.tpl"
      - "labels.tpl"
      - "social-share.tpl"
    performance:
      lcp_target: "product-image"
      critical_css_required: true
      estimated_load_time: "1.8s"
    nuvemshop_constraints: ["CONSTRAINT #3: Form NOT modified", "CONSTRAINT #2: Footer visible"]

  cart:
    id: "cart"
    name: "Shopping Cart"
    template_file: "templates/cart.tpl"
    type: "transaction"
    description: "Cart page displaying items, totals, and checkout button"
    route: "/cart"
    sections:
      - name: "Cart Items"
        component: "cart-items"
        css: ["style-critical.tpl", "style-async.scss.tpl"]
        js: ["store.js.tpl", "cart-drawer.js.tpl", "cart-utils.js.tpl"]
      - name: "Cart Summary"
        component: "cart-totals"
        file: "snipplets/cart-totals.tpl"
        css: ["style-critical.tpl"]
        js: ["store.js.tpl"]
      - name: "Related Products"
        component: "cart-related"
        file: "snipplets/cart-related-products.tpl"
        css: ["style-async.scss.tpl"]
        js: ["store.js.tpl"]
    snipplets:
      - "cart-item-new.tpl"
      - "cart-item-ajax.tpl"
      - "cart-totals.tpl"
      - "cart-related-products.tpl"
      - "cart-banner.tpl"
    performance:
      lcp_target: "cart-item-new"
      critical_css_required: true
      estimated_load_time: "1.5s"
    nuvemshop_constraints: ["CONSTRAINT #1: Checkout structure protected", "CONSTRAINT #2: Footer attribution"]
    robots_meta: "noindex, nofollow"

  checkout:
    id: "checkout"
    name: "Checkout (Nuvemshop Managed)"
    template_file: "Not applicable (Nuvemshop platform)"
    type: "transaction"
    description: "Checkout flow managed entirely by Nuvemshop backend"
    route: "/checkout"
    notes: "CRITICAL: This page is controlled by Nuvemshop. Theme can only style, NOT modify structure."
    nuvemshop_constraints: ["CONSTRAINT #1: Form structure PROTECTED", "CONSTRAINT #2: Footer attribution"]
    robots_meta: "noindex, nofollow"

  category:
    id: "category"
    name: "Category/Department Page"
    template_file: "templates/category.tpl"
    type: "listing"
    description: "Product category with filters, sorting, and product grid"
    route: "/category/:slug"
    sections:
      - name: "Category Banner"
        component: "category-banner"
        file: "snipplets/category-banner.tpl"
        css: ["style-critical.tpl", "style-home-v2.css"]
      - name: "Filters Panel"
        component: "filters"
        css: ["style-critical.tpl", "style-filters-patagang.css.tpl"]
        js: ["store.js.tpl", "external.js.tpl"]
      - name: "Product Grid"
        component: "product-grid"
        file: "snipplets/product_grid.tpl"
        css: ["style-async.scss.tpl"]
        js: ["store.js.tpl"]
    snipplets:
      - "product_grid.tpl"
      - "breadcrumbs.tpl"
      - "category-banner.tpl"
    performance:
      lcp_target: "category-banner"
      critical_css_required: true
      estimated_load_time: "2.0s"
    nuvemshop_constraints: []

  search:
    id: "search"
    name: "Search Results Page"
    template_file: "templates/search.tpl"
    type: "listing"
    description: "Search results with product grid and filters"
    route: "/search?q=:query"
    sections:
      - name: "Search Form"
        component: "search-input"
        css: ["style-critical.tpl"]
      - name: "Results Grid"
        component: "product-grid"
        css: ["style-async.scss.tpl"]
        js: ["store.js.tpl"]
    snipplets:
      - "product_grid.tpl"
      - "breadcrumbs.tpl"
    performance:
      estimated_load_time: "1.8s"
    robots_meta: "noindex, follow"

  blog:
    id: "blog"
    name: "Blog Listing"
    template_file: "templates/blog.tpl"
    type: "content"
    description: "Blog post listing page with pagination"
    route: "/blog"
    sections:
      - name: "Blog Post Cards"
        component: "blog-grid"
        css: ["style-blog.scss.tpl", "style-async.scss.tpl"]
        js: ["store.js.tpl"]
    snipplets:
      - "blog-item.tpl"
      - "blog-post-card.tpl"
    performance:
      estimated_load_time: "1.5s"

  blog_post:
    id: "blog-post"
    name: "Blog Post Detail"
    template_file: "templates/blog-post.tpl"
    type: "content"
    description: "Individual blog post with comments, sharing"
    route: "/blog/:slug"
    sections:
      - name: "Post Content"
        component: "post-content"
        css: ["style-blog.scss.tpl"]
        js: ["store.js.tpl"]
    snipplets:
      - "blog-item.tpl"
      - "social-share.tpl"
    performance:
      estimated_load_time: "1.4s"

  page_generic:
    id: "page"
    name: "Generic Page (About, Contact, etc)"
    template_file: "templates/page.tpl"
    type: "content"
    description: "Generic content page from Nuvemshop CMS"
    route: "/pages/:slug"
    sections:
      - name: "Page Content"
        component: "page-content"
        css: ["style-critical.tpl"]
    snipplets:
      - "page-header.tpl"
      - "page-custom.tpl"
    performance:
      estimated_load_time: "0.8s"

  contact:
    id: "contact"
    name: "Contact Page"
    template_file: "templates/contact.tpl"
    type: "form"
    description: "Contact form and support information"
    route: "/contact"
    sections:
      - name: "Contact Form"
        component: "contact-form"
        css: ["style-critical.tpl"]
        js: ["store.js.tpl"]
      - name: "Contact Links"
        component: "contact-links"
        file: "snipplets/contact-links.tpl"
        css: ["style-critical.tpl"]
    nuvemshop_constraints: ["CONSTRAINT #3: Form structure protected"]
    robots_meta: "index, follow"

  account_login:
    id: "account-login"
    name: "Customer Account - Login"
    template_file: "templates/account/login.tpl"
    type: "account"
    description: "Customer login page"
    route: "/account/login"
    sections:
      - name: "Login Form"
        component: "login-form"
        css: ["style-critical.tpl"]
        js: ["store.js.tpl"]
    snipplets:
      - "tooltip-login.tpl"
    nuvemshop_constraints: ["CONSTRAINT #3: Form NOT modified"]
    robots_meta: "noindex, nofollow"

  account_register:
    id: "account-register"
    name: "Customer Account - Registration"
    template_file: "templates/account/register.tpl"
    type: "account"
    description: "Customer registration page"
    route: "/account/register"
    nuvemshop_constraints: ["CONSTRAINT #5: Registration form protected"]
    robots_meta: "noindex, nofollow"

  account_orders:
    id: "account-orders"
    name: "Customer Account - Orders History"
    template_file: "templates/account/orders.tpl"
    type: "account"
    description: "Customer orders list"
    route: "/account/orders"
    robots_meta: "noindex, nofollow"

  error_404:
    id: "404"
    name: "404 Error Page"
    template_file: "templates/404.tpl"
    type: "error"
    description: "Page not found"
    route: "/404"

  password_protected:
    id: "password"
    name: "Password Protected Store"
    template_file: "templates/password.tpl"
    type: "access"
    description: "Password protection page (if store is in maintenance)"
    route: "/password"


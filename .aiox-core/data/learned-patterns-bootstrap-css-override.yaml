## Pattern 1: CSS Cascade Conflict with Bootstrap Classes

### Problem
When overriding Bootstrap grid classes (`.col-*`, `.col-lg-*`) with custom classes, CSS specificity can cause unintended behavior:

```html
<!-- Structure -->
<div class="col-12 col-lg-5 pg-pdp-info-col">
```

```css
/* Bootstrap declares (matches media query >= 992px) */
@media (min-width: 992px) {
  .col-lg-5 {
    max-width: 41.666667%;     /* This is inherited even in mobile! */
    flex: 0 0 41.666667%;
  }
}

/* Our CSS tries to override (mobile < 992px) */
.pg-pdp-info-col {
  width: 100%;                 /* ❌ FAILS: max-width still 41.67% */
  max-width: 100%;             /* ❌ FAILS: No !important */
}
```

**Result:** In mobile, `max-width: 41.666667%` from Bootstrap wins because:
- It's a more specific property (max-width vs width)
- Our override lacks `!important` flag
- Browser applies most restrictive value: 41.67%

### Solution: Multi-Layer Override Strategy

```css
/* Layer 1: Explicit max-width override with !important */
.pg-pdp-info-col {
  max-width: 100% !important;   /* Forces max-width to 100% */
  width: 100% !important;        /* Ensures width is 100% */
}

/* Layer 2: Remove inherited padding from Bootstrap */
.pg-pdp-image-col,
.pg-pdp-info-col {
  padding-right: 0 !important;  /* Bootstrap default is 15px */
  padding-left: 0 !important;   /* Must be explicit in mobile context */
}

/* Layer 3: Reinforce flexbox layout */
.pg-pdp-container .section-single-product {
  display: flex !important;
  flex-direction: column !important;
  align-items: stretch !important;  /* Ensures children span 100% width */
}

/* Layer 4: Flex basis override (if needed) */
.pg-pdp-info-col {
  flex: 0 0 100% !important;    /* Forces flex to 100% */
}
```

**Why This Works:**
1. **Layer 1** directly overrides the conflicting property
2. **Layer 2** removes padding that reduces effective width
3. **Layer 3** ensures parent container properly distributes flex space
4. **Layer 4** uses flex shorthand for absolute certainty


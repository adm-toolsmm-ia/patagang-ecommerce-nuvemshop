## Pattern 3: Debugging Specificity Conflicts

### How to Identify
1. Open DevTools (F12)
2. Inspect element (Ctrl+Shift+C)
3. Look at "Computed" tab
4. Check which rules are **strikethrough** (overridden)

**Example Output:**
```
max-width: 41.666667%  ← From .col-lg-5 (active)
  ✗ max-width: 100%    ← From .pg-pdp-info-col (overridden!)
  ✗ width: 100%        ← Also overridden

→ Problem: .col-lg-5 has higher specificity in this context
```

### Solution Checklist
- [ ] Check if property uses `!important` in both rules
- [ ] Verify media query is actually active (F12 > responsive view)
- [ ] Look for min/max-width conflicts (max-width is more restrictive)
- [ ] Count selector specificity: ID (100) > class (10) > element (1)
- [ ] Try adding `!important` to custom rule
- [ ] If still failing, use inline `style` attribute (last resort)


## Pattern 2: Mobile-First Media Query Fallback

### Problem
Bootstrap media queries activate AT breakpoint (e.g., `@media (min-width: 992px)`).
But properties from larger breakpoints are NOT automatically deactivated in smaller viewports—they cascade.

```css
/* This rule applies in BOTH desktop AND mobile */
.col-lg-5 {
  flex: 0 0 41.666667%;      /* ❌ Active in mobile too! */
}

/* This rule ONLY applies >= 992px */
@media (min-width: 992px) {
  .col-lg-5 {
    display: flex;           /* ✅ Only in desktop */
  }
}
```

### Solution: Explicit Mobile Reset

```css
/* Mobile-first: Set to 100% for ALL sizes */
.pg-pdp-info-col {
  max-width: 100% !important;
  width: 100%;
}

/* Desktop-specific: Only adjust if needed */
@media (min-width: 992px) {
  .pg-pdp-info-col {
    /* Override mobile rules only in desktop context */
    max-width: 41.666667% !important;
    width: 41.666667%;
  }
}
```

**Key Insight:** Don't assume media queries prevent property inheritance. Always explicitly set properties in mobile context first.


## Pattern 4: Bootstrap Spacing Classes in Custom Layouts

### Problem
Bootstrap padding/margin classes conflict with custom spacing:

```html
<div class="col-12 col-lg-5 pg-custom-spacing">
  <!-- Has .col-12 padding of 15px left/right by default -->
</div>
```

```css
.col-12 {
  padding-right: 15px;
  padding-left: 15px;
}

.pg-custom-spacing {
  padding: 0;  /* ❌ Fails, Bootstrap wins */
}
```

### Solution
```css
/* Remove Bootstrap padding explicitly */
.pg-custom-spacing {
  padding: 0 !important;
}

/* OR remove specific directions */
.pg-custom-spacing {
  padding-right: 0 !important;
  padding-left: 0 !important;
}

/* BEST: Target the column classes directly */
.pg-pdp-container .col-12,
.pg-pdp-container .col-lg-5 {
  padding-right: 0 !important;
  padding-left: 0 !important;
}
```


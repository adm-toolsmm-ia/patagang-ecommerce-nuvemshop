name: "FTP Deployment Workflow v2.0"
version: "2.0.0"
framework: "AIOX"
description: "Sistema de versionamento e deploy automático via FTP para Nuvemshop Patagang"
status: "production"

entry_point:
  command: "npm run deploy 'Descrição'"
  script: "ftp-deploy/deploy.js"

phases:
  - phase: "0"
    name: "Context Validation"
    description: "Validar credenciais FTP, story, git"

  - phase: "1"
    name: "Detect Modified Files"
    description: "Auto-detect via git diff"
    command: "git diff --name-only HEAD -- theme-deploy-corrigido/"

  - phase: "2"
    name: "Auto-Increment Version"
    description: "Incrementar versão (patch/minor)"
    default: "patch (1.1.8 → 1.1.9)"
    with_flag: "--minor (1.1.8 → 1.2.0)"

  - phase: "3"
    name: "Git Commit + Tag + Push"
    description: "Commitar versão, criar tag, push com confirmação"
    
  - phase: "4"
    name: "Incremental Backup"
    description: "Fazer backup dos arquivos do FTP"
    location: "backups/deployment-{version}/{timestamp}/"

  - phase: "5"
    name: "Deploy to FTP"
    description: "Upload dos arquivos para servidor"
    timeout: "30 segundos/arquivo"

  - phase: "6"
    name: "Post-Deploy Validation"
    description: "Validar integridade no FTP"

modes:
  dry_run:
    flag: "--dry-run"
    use_case: "Validar antes de deploy real"

  force:
    flag: "--force"
    use_case: "CI/CD automation"

references:
  user_guide: "docs/guides/nuvemshop/deployment-workflow.md"
  cli_readme: "ftp-deploy/README-DEPLOYMENT.md"
  task_spec: ".aiox-core/development/tasks/deploy-ftp-standard.md"

metadata:
  version: "2.0.0"
  framework: "AIOX v2"
  status: "Production Ready"

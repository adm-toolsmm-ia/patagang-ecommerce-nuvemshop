## 🔄 Estados Possíveis

```
START
  ↓
[1] Validation → FAIL → ABORT + ROLLBACK
  ↓ SUCCESS
[2] Backup → FAIL → ABORT (keep backup for manual restore)
  ↓ SUCCESS
[3] Deploy → PARTIAL FAIL → Continue (log failures)
  ↓
[4] Post-Deploy Validation → OK
  ↓
[5] Production Check → OK
  ↓
COMPLETE ✅
```

---

## 🚨 Contingência & Rollback

### Se Deploy Falhou (Fase 3)

```bash
# 1. Verificar backup criado
ls -la backups/incremental/2026-03-20T10-30-45/

# 2. Restaurar para estado anterior
npm run rollback -- 2026-03-20T10-30-45

# 3. Re-deploy com --force-all
npm run deploy -- --force-all

# 4. Validar versão em produção
# Aguardar cache clear Nuvemshop
```

**Tempo total de rollback:** 2-5 minutos

### Se Backup Não Completou (Fase 2)

```bash
# 1. Usar backup anterior
npm run list

# 2. Sincronizar backup anterior com local
node sync-backup-to-local.js {TIMESTAMP_ANTERIOR}

# 3. Deploy a partir do backup restaurado
npm run deploy
```


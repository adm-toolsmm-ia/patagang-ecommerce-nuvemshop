## 🎯 Fases de Execução

### Fase 1: Validação Pré-Deploy
**Task:** `validate-ftp-environment.md`
**Tempo:** 2-3 minutos
**Responsável:** @devops

**Atividades:**
- ✓ Verificar conexão FTP (timeout test)
- ✓ Validar estrutura local (theme-deploy-corrigido)
- ✓ Confirmar credenciais FTP
- ✓ Listar arquivos para deploy (tree)
- ✓ Calcular tamanho total

**Saída:**
```json
{
  "phase": "validation",
  "status": "success",
  "ftp_connection": "ok",
  "local_files": 150,
  "total_size_mb": 35.2,
  "validation_timestamp": "2026-03-20T10:15:30Z"
}
```

**Go/No-Go Decision:**
- GO: Prosseguir para Fase 2
- NO-GO: Aguardar resolução e retry

---

### Fase 2: Backup Incremental Pré-Deploy
**Task:** `backup-incremental-ftp.md`
**Tempo:** 5-15 minutos (depende do tamanho)
**Responsável:** @devops

**Atividades:**
- ✓ Criar diretório backup datado: `backups/incremental/{ISO_TIMESTAMP}/`
- ✓ Calcular MD5 dos arquivos locais
- ✓ Comparar com último deploy (diff)
- ✓ Download apenas dos arquivos que serão alterados do FTP
- ✓ Gerar `_BACKUP_METADATA.json` (lista completa + hashes)
- ✓ Gerar `README.md` (instruções de restauração)

**Saída:**
```json
{
  "phase": "backup",
  "status": "success",
  "backup_path": "backups/incremental/2026-03-20T10-30-45",
  "files_backed_up": 28,
  "total_size_mb": 3.2,
  "duration_seconds": 120,
  "metadata_file": "_BACKUP_METADATA.json"
}
```

**Contingência:**
- Se falhar: Retry automático 3x
- Se continuar falhando: Abortar deploy, usar backup anterior

---

### Fase 3: Deploy Otimizado com Injeção de Versão
**Task:** `deploy-optimized-ftp.md`
**Tempo:** 10-30 minutos (depende da quantidade de arquivos)
**Responsável:** @devops

**Atividades:**
- ✓ Carregar cache de MD5 (`.deploy-cache.json`)
- ✓ Filtrar apenas arquivos modificados
- ✓ Injetar versão em arquivo raiz (ex: `layout.tpl`)
- ✓ Upload em lotes de 10 arquivos
- ✓ Reconectar FTP a cada 50 arquivos (estabilidade)
- ✓ Retry automático: 3 tentativas por arquivo
- ✓ Atualizar cache MD5
- ✓ Restaurar arquivo original pós-upload

**Lógica de Injeção de Versão:**
```
Se remotePath === 'layouts/layout.tpl':
  1. Substituir PLACEHOLDER_VERSION_ID → nova_versao
  2. Upload versão injetada
  3. Restaurar arquivo local original
  Garante que console do navegador sempre mostra versão correta
```

**Saída:**
```json
{
  "phase": "deploy",
  "status": "success",
  "files_modified": 28,
  "files_uploaded": 28,
  "files_failed": 0,
  "retry_count": 2,
  "duration_seconds": 240,
  "total_size_mb": 3.2,
  "speed_avg_mbps": 0.8,
  "reconnects": 1,
  "version_injected": "v1.1.1"
}
```

**Retry Strategy:**
```
Arquivo falha (erro de rede):
  → Aguardar 2 segundos
  → Tentar novamente (máx 3 tentativas)
  → Se 3 tentativas falharem: Log e continuar
  → Ao final: Relatório de falhas
```

---

### Fase 4: Validação Pós-Deploy e Documentação
**Task:** `validate-post-deploy.md`
**Tempo:** 3-5 minutos
**Responsável:** @devops

**Atividades:**
- ✓ Verificar integridade remota (last-modified)
- ✓ Gerar relatório de upload
- ✓ Atualizar `LAST_DEPLOY_VERSION.txt`
- ✓ Registrar em `DEPLOY_HISTORY.json`
- ✓ Criar resumo de alterações
- ✓ Log final com sucesso/avisos

**Saída:**
```json
{
  "phase": "validation",
  "status": "success",
  "remote_verification": "ok",
  "version_file_updated": "LAST_DEPLOY_VERSION.txt",
  "history_recorded": "DEPLOY_HISTORY.json",
  "console_version_visible": true,
  "deployment_date": "2026-03-20T10:30:45Z",
  "git_commit": "9502c44",
  "git_branch": "main"
}
```

**Checklist Pós-Deploy:**
- [ ] Versão em LAST_DEPLOY_VERSION.txt corresponde à injetada
- [ ] Backup incremental existe e está acessível
- [ ] Cache MD5 atualizado
- [ ] Logs registrados
- [ ] Nenhum arquivo critical falhou

---

### Fase 5: Validação Visual em Produção
**Task:** `verify-production-deployment.md`
**Tempo:** 5-10 minutos (manual + automática)
**Responsável:** @devops + @qa

**Atividades:**
- ✓ Acessar loja: https://patagang.lojavirtualnuvem.com.br/
- ✓ Abrir console do navegador (F12)
- ✓ Verificar `window.__PATAGANG_VERSION__` (mostra versão + commit)
- ✓ Limpar cache Nuvemshop (se necessário)
- ✓ Aguardar 3-5 minutos de propagação
- ✓ Testar funcionalidades críticas (busca, carrinho, checkout)
- ✓ Validar responsividade (desktop + mobile)

**Saída:**
```json
{
  "phase": "production_validation",
  "status": "success",
  "console_version": "v1.1.1",
  "deployment_date": "2026-03-20T10:30:45Z",
  "git_commit": "9502c44",
  "visual_check": "passed",
  "cache_cleared": true,
  "propagation_time_seconds": 180
}
```

